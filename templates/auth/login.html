{% extends '../includes/auth_base.html' %} {% load static %}
{% block content %}
<div class="container-fluid">
    <div class="row row-cols-1 row-cols-lg-2 col-12 col-lg-9 mx-auto d-flex align-items-center justify-content-center" style="height: 100vh; margin: 0;">

        
        <div class="login-form bg-white rounded-5 rounded-end p-5">
            <h5 class="text-muted text-center mb-3"><a href="/"></a></h5>
            <h4>Bienvenu </h4>
            <div><span class="text-muted me-2">Besoin d'un compte ?</span><span><a href={% url 'register' %}>Créer compte</a></span></div>
            <h5 class="my-3">Se connecter</h5>
            <form action="" method="POST">
                {% csrf_token %}
                {% include '../includes/display_errors.html' %}
                <div class="form-group">
                    <label class="position-relative text-muted w-100">Email
                        <input name="email" type="email" class="form-control" required>
                        <span class="position-absolute top-50 end-5"></span>
                    </label>
                </div>
                <div class="form-group my-3">
                    <label class="position-relative text-muted w-100">Mot de passe
                        <input name="password" type="password" class="form-control" required>
                        <span class="position-absolute top-50 end-5"></span>
                    </label>
                </div>
                <div class="d-flex flex-wrap justify-content-between">
                    <div>
                        <label>
                            <input type="checkbox" name="remember">
                            <span class="text-muted">Se souvenir de moi</span>
                        </label>
                    </div>
                    <div class="mt-3 mt-lg-0"><a href={% url 'forgotPassword' %} class="fd-color-blue">Mot de passe oublié ?</a></div>
                </div>
                <div class="submit my-3">
                    <button type="submit" class="btn fd-bg-secondary text-white w-100 shadow">Se connecter</button>
                </div>
               
            </form>
        </div>
    </div>
</div>
{% endblock content %}
{% block style %}
<style>

</style>
{% endblock %}
